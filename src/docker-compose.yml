services:
  school-fee-tracker:
    build: .
    container_name: school-fee-tracker
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data_store:/app/data_store   # database.db and backups/
      - ./secrets:/app/secrets         # identifier.key - back this up separately!
      - ./logs:/app/logs
    environment:
      SPT_FEE_DUE_DAY: "${SPT_FEE_DUE_DAY:-10}"
      SPT_SMTP_HOST: "${SPT_SMTP_HOST:-}"
      SPT_SMTP_PORT: "${SPT_SMTP_PORT:-587}"
      SPT_SMTP_USER: "${SPT_SMTP_USER:-}"
      SPT_SMTP_PASSWORD: "${SPT_SMTP_PASSWORD:-}"
      SPT_BACKUP_EMAIL_TO: "${SPT_BACKUP_EMAIL_TO:-}"
